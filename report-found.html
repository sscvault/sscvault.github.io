<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Found Item · SSC Vault</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">SSC <span>Vault</span></a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="report-lost.html" class="nav-link">Report Lost</a>
        <a href="report-found.html" class="nav-link">Report Found</a>
        <a href="browse.html" class="nav-link">Browse</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <div class="container">
      <div class="form-card">
        <h1>Report Found Item</h1>
        <p class="form-sub">Found something? Report it so the owner can claim it.</p>

        <form id="found-form">
          <div class="form-group">
            <label>Item Name / Title <span class="req">*</span></label>
            <input type="text" name="title" required placeholder="e.g. Black Wireless Earbuds" />
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea name="description" placeholder="Any details that help identify the item..."></textarea>
          </div>

          <div class="form-group">
            <label>Category <span class="req">*</span></label>
            <select name="category" required>
              <option value="">Select category</option>
              <option value="ID Card / Documents">ID Card / Documents</option>
              <option value="Electronics">Electronics</option>
              <option value="Keys / Access cards">Keys / Access cards</option>
              <option value="Books / Stationery">Books / Stationery</option>
              <option value="Clothing / Accessories">Clothing / Accessories</option>
              <option value="Bags / Wallets">Bags / Wallets</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Location Found <span class="req">*</span></label>
            <input type="text" name="location" required placeholder="e.g. Near Parking Gate / Classroom B12" />
          </div>

          <div class="form-group">
            <label>Date Found <span class="req">*</span></label>
            <input type="date" name="item_date" required />
          </div>

          <div class="form-group">
            <label>Your Contact (Email or Phone) <span class="req">*</span></label>
            <input type="text" name="contact" required placeholder="you@email.com or 98xxxxxxxx" />
          </div>

          <div class="form-group">
            <label>Photo (optional, max 3 MB)</label>
            <input type="file" name="image" id="found-image" accept="image/*" />
            <div class="image-preview" id="found-preview"></div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-secondary">Submit Found Report</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SSC Vault · Shri Shivaji College of Arts, Commerce and Science</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Items · Boomeriyah L&F</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Boomeriyah <span>L&amp;F</span></a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="report-lost.html" class="nav-link">Report Lost</a>
        <a href="report-found.html" class="nav-link">Report Found</a>
        <a href="browse.html" class="nav-link">Browse</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Browse All Items</h1>

      <div class="filters">
        <div class="form-group">
          <label>Search</label>
          <input type="text" id="filter-search" placeholder="Title or description..." />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="filter-status">
            <option value="all">All</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
          </select>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="filter-category">
            <option value="all">All Categories</option>
            <option value="ID Card / Documents">ID Card / Documents</option>
            <option value="Electronics">Electronics</option>
            <option value="Keys / Access cards">Keys / Access cards</option>
            <option value="Books / Stationery">Books / Stationery</option>
            <option value="Clothing / Accessories">Clothing / Accessories</option>
            <option value="Bags / Wallets">Bags / Wallets</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location contains</label>
          <input type="text" id="filter-location" placeholder="e.g. Library" />
        </div>
        <div class="form-group">
          <label>Date From</label>
          <input type="date" id="filter-date-from" />
        </div>
        <div class="form-group">
          <label>Date To</label>
          <input type="date" id="filter-date-to" />
        </div>
        <div class="filter-actions">
          <button type="button" id="filter-btn" class="btn btn-accent">Apply</button>
          <button type="button" id="clear-filters" class="btn btn-blue">Clear</button>
        </div>
      </div>

      <div id="items-grid" class="items-grid">
        <!-- Items loaded by JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Boomeriyah Lost & Found · Shri Shivaji College of Arts, Commerce and Science</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
